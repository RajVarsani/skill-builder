name: Scrape Skills

on:
  schedule:
    - cron: "0 0 * * *" # every 24 hours at midnight UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scraper
        run: pnpm scrape-skills

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet dataset/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create PR with updated dataset
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="scrape/update-skills-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add dataset/
          git commit -m "chore: update skills dataset $(date +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create \
            --title "Update skills dataset — $(date +%Y-%m-%d)" \
            --body "$(cat <<'EOF'
          ## Summary
          - Automated scrape of skills.sh completed
          - Dataset chunks updated with latest skills data

          ## Triggered by
          - ${{ github.event_name }} (${{ github.actor }})

          🤖 Generated by GitHub Actions
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
