services:
  - type: web
    name: actingas-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: "3000"
      - key: FRONTEND_URL
        value: "https://actingas.me"
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_REGION
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GITHUB_APP_ID
        value: "2976626"
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_INSTALLATION_ID
        value: "113296665"
      - key: GITHUB_ORG_NAME
        value: "skill-builder-agent"
